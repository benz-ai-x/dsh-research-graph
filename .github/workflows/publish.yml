name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    environment: npm-publish
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # pnpm 11.7 lockfile verification ignores minimumReleaseAgeExclude; the
      # day-old DSH set explicitly excluded in pnpm-workspace.yaml must not
      # fail frozen installs or pre-run dependency checks for 24 hours.
      pnpm_config_minimum_release_age: 0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          install: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install npm with trusted-publishing support
        run: npm install --global 'npm@^11.5.1'

      - name: Verify tag and package version
        run: |
          node scripts/check-version.mjs
          tagged_commit=$(git rev-list -n 1 "$RELEASE_TAG")
          checked_out_commit=$(git rev-parse HEAD)
          if test "$tagged_commit" != "$checked_out_commit"; then
            echo "checked out $checked_out_commit instead of $tagged_commit for $RELEASE_TAG" >&2
            exit 1
          fi

      # pnpm 11.7 lockfile verification ignores minimumReleaseAgeExclude;
      # the excluded day-old DSH 0.1.6-alpha.2 set must not block publishing.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

      - name: Pack the verified package
        run: pnpm pack --pack-destination .artifacts

      - name: Publish the verified archive
        run: |
          package_version=$(node -p 'require("./package.json").version')
          package_basename=$(node -p 'require("./package.json").name.replace(/^@/, "").replace("/", "-")')
          package_archive=".artifacts/$package_basename-$package_version.tgz"
          publish_tag=$(node -p 'require("./package.json").version.includes("-") ? "next" : "latest"')
          npm publish "$package_archive" --access public --provenance --tag "$publish_tag" --loglevel verbose
