name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DSH_REPOSITORY: deepseek-ai/deepseek-harness

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24', '26']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - if: matrix.node == '24'
        run: pnpm pack --pack-destination .artifacts

  harness:
    name: Matching DSH release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select the matching DSH release
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "DSH_VERSION=" + require("./package.json").version + "\n")'

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.DSH_REPOSITORY }}
          ref: dsh-v${{ env.DSH_VERSION }}
          path: harness
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: |
            pnpm-lock.yaml
            harness/pnpm-lock.yaml
          install: false

      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Harness dependencies
        run: pnpm --dir harness install --frozen-lockfile

      - name: Build Harness native persistence support
        run: pnpm --dir harness run build:native-system

      - name: Build Harness public declarations and runtime
        run: pnpm --dir harness run build:lib

      - name: Check Host and Client against the matching Harness
        env:
          DSH_HARNESS_ROOT: ${{ github.workspace }}/harness
        run: pnpm check:harness

      - name: Pack the plugin
        run: pnpm pack --pack-destination .artifacts

      - name: Build the Harness Web frontend
        run: pnpm --dir harness run build:web

      - name: Exercise the packed plugin in an isolated web profile
        env:
          DSH_HARNESS_ROOT: ${{ github.workspace }}/harness
        run: pnpm smoke:harness
