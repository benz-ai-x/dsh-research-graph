name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DSH_REPOSITORY: deepseek-ai/deepseek-harness

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24', '26']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          install: false

      # pnpm 11.7 lockfile verification ignores minimumReleaseAgeExclude;
      # the day-old DSH 0.1.6-alpha.2 set is explicitly excluded in
      # pnpm-workspace.yaml, so the redundant age gate stays off here.
      - run: pnpm --config.minimumReleaseAge=0 install --frozen-lockfile
      - run: pnpm --config.minimumReleaseAge=0 run check
      - if: matrix.node == '24'
        run: pnpm --config.minimumReleaseAge=0 pack --pack-destination .artifacts

  harness:
    name: Matching DSH release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select the matching DSH release
        run: |
          dsh_version=$(node scripts/check-version.mjs --dsh-version)
          echo "DSH_VERSION=$dsh_version" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.DSH_REPOSITORY }}
          ref: dsh-v${{ env.DSH_VERSION }}
          path: harness
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: |
            pnpm-lock.yaml
            harness/pnpm-lock.yaml
          install: false

      - name: Install plugin dependencies
        # pnpm 11.7 lockfile verification ignores minimumReleaseAgeExclude;
        # see the check job above.
        run: pnpm --config.minimumReleaseAge=0 install --frozen-lockfile

      - name: Install Harness dependencies
        run: pnpm --dir harness install --frozen-lockfile

      - name: Build Harness native persistence support
        run: pnpm --dir harness run build:native-system

      - name: Build Harness public declarations and runtime
        run: pnpm --dir harness run build:lib

      - name: Check Host and Client against the matching Harness
        env:
          DSH_HARNESS_ROOT: ${{ github.workspace }}/harness
        run: pnpm check:harness

      - name: Pack the plugin
        run: pnpm --config.minimumReleaseAge=0 pack --pack-destination .artifacts

      - name: Build the Harness Web frontend
        run: pnpm --dir harness run build:web

      - name: Exercise the packed plugin in an isolated web profile
        env:
          DSH_HARNESS_ROOT: ${{ github.workspace }}/harness
        run: pnpm smoke:harness
